date.timezone = ${PHP_TIME_ZONE}
memory_limit = ${PHP_MEMORY_LIMIT}
upload_max_filesize = ${PHP_UPLOAD_MAX_FILESIZE}
post_max_size = ${PHP_POST_MAX_SIZE}

; Security hardening
; Prevent remote file inclusion attacks
allow_url_include = Off
; Disable dangerous functions that are rarely needed in web applications
; Note: Adjust this list based on your application's requirements
; Note: proc_open/popen intentionally left enabled — Composer requires process spawning
disable_functions = exec,passthru,shell_exec,system,curl_exec,curl_multi_exec,parse_ini_file,show_source
